name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    # The smoke test is the only fully portable one: it mounts the plugin against a
    # fake prompt registry, so it needs no host install. integration.mjs and
    # lifecycle.mjs boot the real @deepseek-ai/cordis + dsh-system-prompt from a
    # local DSH install and stay a local check (see README / DSH_MODULE_ROOT).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node test/smoke.mjs
